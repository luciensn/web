<!DOCTYPE HTML>
<html>
<head>
    <!--ROBOTS-->
    <meta name="robots" content="nofollow">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title id="title">google search</title>
    <meta name="description" content="" />
    <link rel="shortcut icon nofollow" type="image/png" href="g.png">

    <!-- Press Start 2P -->
    <link rel="preconnect nofollow" href="https://fonts.googleapis.com">
    <link rel="preconnect nofollow" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet nofollow">

    <style type="text/css">
        :root {
            --bg: #111522;
            --panel: #20263a;
            --panel-dark: #171c2b;
            --ink: #f7f4e8;
            --muted: #9aa4bd;
            --green: #73f59b;
            --green-dark: #31b967;
            --blue: #69c7ff;
            --blue-dark: #348fc2;
            --pink: #ff77b7;
            --yellow: #ffd45c;
            --shadow: #080a11;
            --pixel: 4px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            overflow-x: hidden;
            background-color: var(--bg);
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
            background-size: 16px 16px;
            color: var(--ink);
            font-family: "Press Start 2P", monospace;
            image-rendering: pixelated;
        }

        .center {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .search-card {
            position: relative;
            width: 100%;
            padding: clamp(24px, 5vw, 48px);
            background: var(--panel);
            /*border: var(--pixel) solid var(--ink);*/
            box-shadow:
                8px 0 0 var(--shadow),
                0 8px 0 var(--shadow),
                8px 8px 0 var(--shadow),
                inset 0 0 0 var(--pixel) var(--panel-dark);
        }

        .search-card::before {
            content: "GIVE IT A GOOG!";
            display: block;
            margin-bottom: 22px;
            color: var(--muted);
            opacity: .7;
            font-size: clamp(9px, 1.7vw, 12px);
            line-height: 1.5;
            text-align: center;
            text-shadow: none;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap::before {
            content: ">";
            position: absolute;
            left: 16px;
            top: 50%;
            z-index: 1;
            transform: translateY(-50%);
            color: var(--green);
            font-size: 14px;
            pointer-events: none;
        }

        input[type=text] {
            display: block;
            width: 100%;
            min-height: 58px;
            margin: 0;
            padding: 16px 16px 16px 44px;
            appearance: none;
            -webkit-appearance: none;
            background: #0d111d;
            color: var(--ink);
            border: var(--pixel) solid var(--ink);
            border-radius: 0;
            outline: none;
            box-shadow: inset 4px 4px 0 #05070d;
            caret-color: var(--green);
            /*font-family: "Press Start 2P", monospace;*/
            font-size: clamp(10px, 2.2vw, 14px);
            line-height: 1.5;
        }

        input[type=text]::placeholder {
            color: #747f99;
            opacity: 1;
        }

        input[type=text]:focus {
            border-color: var(--green);
            box-shadow:
                inset 4px 4px 0 #05070d,
                0 0 0 var(--pixel) rgba(115, 245, 155, .18);
        }

        .btn {
            width: 100%;
            margin: 24px auto 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        button {
            position: relative;
            width: 100%;
            min-height: 58px;
            padding: 14px 12px;
            border: var(--pixel) solid #4f5870;
            border-radius: 0;
            cursor: pointer;
            background: var(--panel-dark);
            color: var(--muted);
            font-family: "Press Start 2P", monospace;
            font-size: clamp(9px, 1.7vw, 12px);
            line-height: 1.4;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 4px 4px 0 var(--shadow);
            transition: transform 70ms linear, box-shadow 70ms linear, color 120ms linear, border-color 120ms linear, background 120ms linear;
            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            background: #1b2132;
            color: var(--ink);
            border-color: #69738d;
        }

        button:focus-visible {
            outline: var(--pixel) dashed var(--muted);
            outline-offset: 6px;
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--shadow);
        }

        .speed-test-link {
            display: block;
            width: fit-content;
            max-width: 100%;
            margin: 30px auto 0;
            color: var(--muted);
            opacity: .72;
            font-size: clamp(8px, 1.5vw, 10px);
            line-height: 1.6;
            text-align: center;
            text-decoration: none;
            transition: opacity 120ms linear, color 120ms linear;
        }

        .speed-test-link:hover,
        .speed-test-link:focus-visible {
            color: var(--ink);
            opacity: 1;
        }

        @media (max-width: 600px) {
            body {
                place-items: start center;
                padding: 18px;
                padding-top: max(40px, env(safe-area-inset-top));
                padding-bottom: max(28px, env(safe-area-inset-bottom));
            }

            .search-card {
                margin-top: 9vh;
                padding: 26px 18px 30px;
                box-shadow:
                    5px 0 0 var(--shadow),
                    0 5px 0 var(--shadow),
                    5px 5px 0 var(--shadow),
                    inset 0 0 0 var(--pixel) var(--panel-dark);
            }

            .btn {
                grid-template-columns: 1fr;
                gap: 18px;
                margin-top: 22px;
            }

            input[type=text],
            button {
                min-height: 60px;
            }

            /* Prevent iOS Safari from zooming when the search field is focused */
            input[type=text] {
                font-size: 16px;
            }

        }

        @media (prefers-reduced-motion: reduce) {
            button {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <!-- Search box -->
    <div class="center">
        <div class="search-card">
            <div class="input-wrap">
                <input type="text" id="searchBox" placeholder="?" autofocus>
            </div>
            <div class="btn">
                <button type="submit" onclick="javascript:doSearch();">Search</button>
                <button type="submit" onclick="javascript:doAISearch();">AI Mode</button>
            </div>
        </div>
        <a class="speed-test-link" href="https://www.google.com/search?q=internet%20speed%20test" target="">Internet Speed Test</a>
    </div>

    <!-- JavaScript -->
    <script type="text/javascript">
        var box = document.getElementById("searchBox");
        box.addEventListener("keydown", function (e) {
            if (e.code === "Enter") {  //checks whether the pressed key is "Enter"
                doSearch();
            }
        });
        function doSearch() {
            var term = box.value;
            window.open("https://www.google.com/search?q="+term,"_self");
        }
        function doAISearch() {
            var term = box.value;
            window.open("https://www.google.com/search?q="+term+"&udm=50","_self");
        }
    </script>

</body>
</html>
